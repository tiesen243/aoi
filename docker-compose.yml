services:
  service-a:
    build:
      context: .
      dockerfile: apps/service-a/Dockerfile

  service-b:
    build:
      context: .
      dockerfile: apps/service-b/Dockerfile

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./packages/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./packages/proxy/certs/local.crt:/etc/nginx/certs/local.crt:ro
      - ./packages/proxy/certs/local.key:/etc/nginx/certs/local.key:ro
    depends_on:
      - service-a
      - service-b
      - web
